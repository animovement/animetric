url: https://animovement.dev/animetric/
home:
  title: "animetric – An R package for calculating movement-based metrics"

# Shared navbar (incl. the animovement dropdown + Zulip), theme, and author
# details are inherited from animovementtemplate.
template:
  bootstrap: 5
  package: animovementtemplate
  bslib:
    primary: "#004F63"

reference:
- title: "Add"
  desc: >
    These return your aniframe with something added: columns of per-row
    measures, a declared orientation, or a derived point.
  contents:
  - add_kinematics
  - add_tortuosity
  - add_nnd
  - add_orientation
  - add_point

- title: "Summarise"
  desc: >
    One row per group: the distribution of per-row measures with
    `summarise_aniframe()`, or the geometry of each whole trajectory with
    `summarise_path()`.
  contents:
  - summarise_aniframe
  - summarise_path

- title: "Compute"
  desc: These functions are cogs used in the `add_` and `summarise_` functions.
  contents:
  - compute_gradient
  - differentiate
  - compute_straightness
  - compute_sinuosity
  - compute_emax
  - compute_min_step
  - compute_point
  - compute_nnd

- title: "Deprecated"
  desc: Kept for one release; see each page for its replacement.
  contents:
  - calculate_kinematics
  - calculate_tortuosity
  - calculate_nnd
  - summarise_kinematics
  - summarise_tortuosity
  - add_centroid
  - compute_centroid
  - is_aniframe_kin
